  <title>中国 · 卡通迷你地图 🗺️</title>

  <!-- Leaflet CDN -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"

  <!-- 地图底图（全局复用，视图切换只增删图层） -->
  <div id="map"></div>

  <!-- 动态视图层：全国总览 / 省级视图 / 城市视图 的 UI 都渲染在这里 -->
  <div id="view"></div>

  <!-- 轻提示 -->
  <div id="toast" class="toast"></div>

  <!-- 配置（IP 定位 key 等） -->
  <script src="config.js"></script>
  <!-- 本地私有配置（真实 key，已被 gitignore，不入库） -->
  <script src="local-config.js"></script>
  <!-- 全国省级元数据 -->
  <script src="cities.js"></script>
  <!-- 主逻辑：路由 / 视图渲染 / IP 自动跳转 -->
  <script src="app.js"></script>
  <!-- 城市数据（每城注册到 window.CITY_DATA；data.js 为无锡手工原型数据，会被生成版覆盖，已停用） -->
